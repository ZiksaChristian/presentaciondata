<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenimiento Predictivo de Unidades de Disco Duro | Caso Backblaze</title>
  <meta name="description" content="Caso de Estudio: Telemetría S.M.A.R.T. y Machine Learning para mantenimiento predictivo de HDDs en Backblaze. XGBoost F2=0.528 sobre 165 fallos reales (test_2019).">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- KaTeX Typography Stylesheet (100% Offline) -->
  <link rel="stylesheet" href="vendor/katex/katex.min.css">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ============================================================
       PRESENTATION CONTAINER
       ============================================================ -->
  <div class="pres-container" id="pres-container">

    <!-- Top Sticky Header (Clean Minimalist Light Design) -->
    <header class="pres-header">
      <div class="brand-wrapper">
        <div class="brand-logo" id="brand-logo" title="Predictive Analytics">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
            <line x1="6" y1="6" x2="6.01" y2="6"></line>
            <line x1="6" y1="18" x2="6.01" y2="18"></line>
          </svg>
        </div>
        <div class="brand-info" id="brand-info">
          <h1 id="header-title">Backblaze | Mantenimiento Predictivo HDD</h1>
        </div>
      </div>

      <!-- Segmented Pill Case Switcher -->
      <div class="case-switcher" id="case-switcher">
        <button class="btn-case active" id="btn-case-backblaze" data-case="backblaze" title="Caso 1: Datacenter Backblaze">
          <span class="case-icon">💽</span>
          <span class="case-text">Caso 1: Backblaze</span>
        </button>
        <button class="btn-case" id="btn-case-importmed" data-case="importmed" title="Caso 2: IMPORTMED S.A.">
          <span class="case-icon">🏥</span>
          <span class="case-text">Caso 2: IMPORTMED</span>
        </button>
      </div>

      <!-- Essential Header Actions -->
      <div class="header-actions">
        <!-- Glossary Drawer Button -->
        <button class="btn-header" id="btn-open-glossary" title="Ver Glosario de Términos">
          <span>📖</span>
          <span id="glossary-btn-text">Glosario</span>
        </button>

        <!-- Fullscreen Button -->
        <button class="btn-header" id="btn-fullscreen" title="Pantalla Completa">
          <span>⛶</span>
        </button>
      </div>
    </header>

    <!-- Main Workspace Body (Full Width Content Canvas) -->
    <div class="pres-body">
      <main class="pres-main" id="pres-main">
        <div id="sections-container">
          <!-- Sections injected dynamically by app.js -->
        </div>
      </main>
    </div>

    <!-- Bottom Sticky Navigation Bar -->
    <footer class="pres-footer-bar" id="pres-footer">
      <div class="footer-nav-buttons">
        <button class="btn-nav-action" id="btn-prev" disabled>
          <span>←</span> Anterior
        </button>
        <button class="btn-nav-action" id="btn-next">
          Siguiente <span>→</span>
        </button>
      </div>

      <div class="footer-progress-indicator">
        <div class="slide-dots" id="slide-dots">
          <!-- Dots dynamically rendered -->
        </div>
        <span id="slide-counter" style="font-family:var(--font-mono); font-size:12px; color:var(--accent-cyan); font-weight:700;">
          01 / 08
        </span>
        <span id="slide-title-label" style="font-size:12.5px; color:var(--text-muted); font-weight:600; margin-left:8px;"></span>
      </div>

      <div style="display:flex; align-items:center; gap:16px;">
        <span style="font-size:11.5px; color:#1e293b; display:inline-flex; align-items:center; gap:6px; font-weight:500;">
          <kbd style="background:#ffffff; border:1px solid #94a3b8; padding:2px 7px; border-radius:4px; font-family:var(--font-mono); color:#000000; font-weight:700;">←</kbd>
          <kbd style="background:#ffffff; border:1px solid #94a3b8; padding:2px 7px; border-radius:4px; font-family:var(--font-mono); color:#000000; font-weight:700;">→</kbd>
          Navegar con teclado
        </span>
      </div>
    </footer>

  </div><!-- /.pres-container -->

  <!-- ============================================================
       SLIDE-OUT GLOSSARY DRAWER
       ============================================================ -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="glossary-drawer" id="glossary-drawer">
    <div class="drawer-header">
      <h3>
        <span>📖</span> Glosario Técnico de IA &amp; Almacenamiento
      </h3>
      <button class="drawer-close-btn" id="drawer-close-btn" title="Cerrar Glosario">&times;</button>
    </div>

    <div class="drawer-search-box">
      <input type="text" id="glossary-search" class="drawer-input"
             placeholder="🔍 Buscar término (ej. XGBoost, Leakage, F2-Score, SMART)...">
    </div>

    <div class="drawer-list" id="glossary-list">
      <!-- Terms rendered dynamically -->
    </div>
  </aside>

  <!-- Global Floating Tooltip -->
  <div class="floating-tooltip" id="floating-tooltip"></div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ============================================================
       LIGHTBOX IMAGE MODAL (Zoom para Gráficas y Dashboards Power BI)
       ============================================================ -->
  <div class="lightbox-modal" id="lightbox-modal">
    <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
    <div class="lightbox-dialog">
      <div class="lightbox-header">
        <div class="lightbox-title-box">
          <span class="badge-tag" id="lightbox-badge" style="background:rgba(16,185,129,0.15); border-color:#10b981; color:#34d399;">ANÁLISIS GRÁFICO</span>
          <h3 id="lightbox-title">Visualización Analítica</h3>
        </div>
        <button class="lightbox-close-btn" id="lightbox-close-btn" title="Cerrar vista">&times;</button>
      </div>
      <div class="lightbox-body">
        <div class="lightbox-img-container">
          <img id="lightbox-img" src="" alt="Gráfica Detallada">
        </div>
        <div class="lightbox-caption" id="lightbox-caption">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================================
       SCRIPTS — KaTeX Math Engine, Data and App Controllers
       ============================================================ -->
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/auto-render.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/data_importmed.js"></script>
  <script src="js/app_importmed.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
